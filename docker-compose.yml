version: "1.0.0"

services:
  postgres:
    container_name: ktk_postgres
    image: postgres:17-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5433:5432
    networks:
      - homelab_network
    env_file:
      - ./ktk-server/.env
  redis:
    container_name: ktk_redis
    image: redis:7.2-alpine
    restart: always
    env_file:
      - ./ktk-server/.env
    ports:
      - 6379:6379
    networks:
      - homelab_network
    volumes:
      - redis_data:/data
    command: sh -c "redis-server --requirepass $${REDIS_PASSWORD}"
  backend:
    container_name: ktk_backend
    build: ./ktk-server
    restart: always
    env_file: ./ktk-server/.env
    environment:
      - POSTGRES_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - REDIS_HOST=redis
      - APPLICATION_URL=${APPLICATION_URL}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN}
    depends_on:
      - postgres
      - redis
    networks:
      - homelab_network
  frontend:
    container_name: ktk_frontend
    build:
      context: ./ktk-client
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_GOOGLE_RECAPTCHA_SITE_KEY=${VITE_GOOGLE_RECAPTCHA_SITE_KEY}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    ports:
      - 5173:80
    depends_on:
      - backend
    networks:
      - homelab_network

volumes:
  postgres_data:
  redis_data:

networks:
  homelab_network:
